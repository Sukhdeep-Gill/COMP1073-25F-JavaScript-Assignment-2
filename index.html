<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoothie Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="header">
    <h1>Smoothie Builder</h1>
    <p>Pick your flavors, customize your smoothie, and see the total instantly!</p>
  </header>

 <main class="container">
    <!-- Smoothie Options Form -->
    <section class="form-card">
      <h2>Your Smoothie</h2>
      <form id="orderForm">
        
        <!-- Customer Name -->
        <div class="form-section">
          <label for="customerName">Name</label>
          <input type="text" id="customerName" placeholder="e.g. Alex" required>
        </div>

        <!-- Size -->
        <div class="form-section">
          <label>Size</label>
          <div class="inline-row">
            <label><input type="radio" name="size" value="small"> Small ($4)</label>
            <label><input type="radio" name="size" value="medium" checked> Medium ($6)</label>
            <label><input type="radio" name="size" value="large"> Large ($8)</label>
          </div>
        </div>

      <!-- Base -->
        <div class="form-section">
          <label>Base ($1)</label>
          <div class="inline-row">
            <label><input type="radio" name="base" value="Yogurt" checked> Yogurt</label>
            <label><input type="radio" name="base" value="Milk"> Milk</label>
            <label><input type="radio" name="base" value="Almond Milk"> Almond Milk</label>
            <label><input type="radio" name="base" value="Fruit Juice"> Juice</label>
          </div>
        </div>  


      <!-- Ingredients -->
        <div class="form-section">
          <label>Ingredients ($0.50 each)</label>
          <div class="inline-row" id="ingredientGroup">
            <label><input type="checkbox" name="ingredient" value="Pineapple"> Pineapple</label>
            <label><input type="checkbox" name="ingredient" value="Raspberry"> Raspberry</label>
            <label><input type="checkbox" name="ingredient" value="Kiwi"> Kiwi</label>
            <label><input type="checkbox" name="ingredient" value="Coconut"> Coconut</label>
            <label><input type="checkbox" name="ingredient" value="Acai"> Acai</label>
            <label><input type="checkbox" name="ingredient" value="Papaya"> Papaya</label>
            <label><input type="checkbox" name="ingredient" value="Matcha"> Matcha</label>
            <label><input type="checkbox" name="ingredient" value="Almond Butter"> Almond Butter</label>
          </div>
        </div>

        <!-- Sweetness -->
        <div class="form-section">
          <label for="sweetness">Sweetness</label>
          <select id="sweetness">
            <option value="None">None</option>
            <option value="Less">Less</option>
            <option value="Normal" selected>Normal</option>
            <option value="Extra">Extra</option>
          </select>
        </div>

        <!-- Extras -->
        <div class="form-section">
          <label>Extras ($0.75 each)</label>
          <div class="inline-row">
            <label><input type="checkbox" name="extra" value="Spirulina"> Spirulina</label>
            <label><input type="checkbox" name="extra" value="Maple Syrup"> Maple Syrup</label>
            <label><input type="checkbox" name="extra" value="Mint Leaves"> Mint Leaves</label>
          </div>
        </div>

        <!-- Quantity -->
        <div class="form-section">
          <label for="qty">Quantity</label>
          <input type="number" id="qty" min="1" max="10" value="1">
        </div>

        <!-- Submit -->
        <div class="form-section">
          <button type="submit">Calculate Total</button>
        </div>
      </form>
    </section>

    <!-- Billing Section -->
    <section class="billing-card">
      <h2>Your Bill</h2>
      <div id="outputArea">
        <p class="muted">Your smoothie details will appear here after ordering!</p>
      </div>
    </section>
  </main>
  <footer>
    &copy; 2025 Smoothie Machine | All Rights Reserved
  </footer>


  <div id="smoothieReadyMessage" class="smoothie-ready">
    <p> Your smoothie is ready! </p>
  </div>
</body>
</html>
